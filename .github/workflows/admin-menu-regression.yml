name: NOVACELL Admin Menu Regression

on:
  push:
    branches:
      - fix/admin-pages-403-v0.6.1
  pull_request:
    branches:
      - feature/etap6-hardening-release
      - main

permissions:
  contents: read

jobs:
  menu-and-php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: |
          set -euo pipefail
          find plugins/novacell-manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Admin menu registration regression
        run: php tests/test-admin-menu-order.php
